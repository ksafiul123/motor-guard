# ??? Server ???????????????????????????????????????????????????????????????????
server.port=8080

# ??? PostgreSQL (matches docker-compose.yml) ??????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/predictive_maintenance
spring.datasource.username=pmuser
spring.datasource.password=pmpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ??? JPA / Hibernate ??????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
# 'update' creates tables on first run, then updates schema on changes.
# Change to 'validate' once schema is stable in production.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ??? Jackson (JSON) ???????????????????????????????????????????????????????????
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ??? Logging ??????????????????????????????????????????????????????????????????
logging.level.com.predictive.maintenance=DEBUG
logging.level.org.springframework.web=INFO

