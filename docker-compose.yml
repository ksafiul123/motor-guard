version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: predictive_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       predictive_maintenance
      POSTGRES_USER:     pmuser
      POSTGRES_PASSWORD: pmpassword
    ports:
      - "5432:5432"           # host:container — Spring Boot connects on localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data persists across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmuser -d predictive_maintenance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin web UI to browse your database visually
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: predictive_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"              # open http://localhost:5050 in browser
    depends_on:
      - postgres

volumes:
  postgres_data: